---
title: Podlewanie
path: garden-irrigation
icon: mdi:sprinkler-variant
type: sections
max_columns: 3
sections:
  - type: grid
    cards:
      - type: grid
        title: Start reczny
        columns: 2
        square: false
        cards:
          - type: tile
            entity: switch.xiao_esp32c6_1_zone_0
            name: Strefa 0
            icon: mdi:valve-open
          - type: tile
            entity: switch.xiao_esp32c6_1_zone_1
            name: Strefa 1
            icon: mdi:valve-open
          - type: tile
            entity: switch.xiao_esp32c6_1_zone_2
            name: Strefa 2
            icon: mdi:valve-open
          - type: tile
            entity: switch.xiao_esp32c6_1_zone_3
            name: Strefa 3
            icon: mdi:valve-open
      - type: button
        name: Stop podlewania
        icon: mdi:stop-circle-outline
        show_state: false
        tap_action:
          action: call-service
          service: garden_irrigation.stop_all
          data:
            device_id: xiao-esp32c6-1
      - type: entities
        title: Plan
        show_header_toggle: false
        entities:
          - entity: sensor.xiao_esp32c6_1_next_watering
            name: Decyzja
            icon: mdi:calendar-clock
          - type: attribute
            entity: sensor.xiao_esp32c6_1_next_watering
            attribute: reason
            name: Powod
            icon: mdi:information-outline
          - type: attribute
            entity: sensor.xiao_esp32c6_1_next_watering
            attribute: active_zones
            name: Aktywne strefy
            icon: mdi:sprinkler-variant
          - type: attribute
            entity: sensor.xiao_esp32c6_1_next_watering
            attribute: scheduled_at
            name: Najblizszy start
            icon: mdi:clock-outline
          - type: attribute
            entity: sensor.xiao_esp32c6_1_next_watering
            attribute: total_duration_minutes
            name: Suma czasu
            icon: mdi:timer-outline
      - type: entities
        title: Decyzja automatyzacji
        show_header_toggle: false
        entities:
          - entity: sensor.xiao_esp32c6_1_automation_decision
            name: Status
            icon: mdi:robot-outline
          - type: attribute
            entity: sensor.xiao_esp32c6_1_automation_decision
            attribute: reason
            name: Powod
            icon: mdi:information-outline
          - entity: number.xiao_esp32c6_1_weather_rain_probability_skip_threshold
            name: Prog prawdopodobienstwa deszczu
            icon: mdi:weather-pouring
          - entity: number.xiao_esp32c6_1_weather_precipitation_skip_threshold
            name: Prog opadu
            icon: mdi:weather-rainy
          - entity: number.xiao_esp32c6_1_weather_humidity_skip_threshold
            name: Prog wilgotnosci
            icon: mdi:water-percent
      - type: entities
        title: Sterownik
        show_header_toggle: false
        entities:
          - entity: binary_sensor.xiao_esp32c6_1_mqtt_availability
            name: Dostepnosc MQTT
            icon: mdi:cloud-check-outline
          - entity: sensor.xiao_esp32c6_1_controller_state
            name: Stan
            icon: mdi:state-machine
          - entity: sensor.xiao_esp32c6_1_diagnostics
            name: Diagnostyka
            icon: mdi:message-alert-outline
          - entity: sensor.xiao_esp32c6_1_network_status
            name: Siec
            icon: mdi:lan-connect
          - entity: sensor.xiao_esp32c6_1_wifi_status
            name: Lacze Wi-Fi
            icon: mdi:wifi
          - entity: sensor.xiao_esp32c6_1_wifi_quality
            name: Jakosc Wi-Fi
            icon: mdi:wifi-strength-3
          - entity: sensor.xiao_esp32c6_1_wifi_signal
            name: RSSI Wi-Fi
            icon: mdi:wifi
      - type: gauge
        entity: sensor.xiao_esp32c6_1_wifi_quality
        name: Jakosc Wi-Fi
        min: 0
        max: 100
        needle: true
        severity:
          red: 0
          yellow: 40
          green: 70

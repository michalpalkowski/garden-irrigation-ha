name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  github-release:
    name: Publish GitHub release
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Validate manifest version matches tag
        run: |
          tag="${GITHUB_REF_NAME#v}"
          version="$(python3 -c 'import json; print(json.load(open("custom_components/garden_irrigation/manifest.json", encoding="utf-8"))["version"])')"
          if [[ "$version" != "$tag" ]]; then
            echo "manifest.json version $version does not match tag $GITHUB_REF_NAME" >&2
            exit 2
          fi

      - name: Run release checks
        run: |
          python3 -m json.tool hacs.json >/dev/null
          python3 -m json.tool custom_components/garden_irrigation/manifest.json >/dev/null
          python3 -m json.tool custom_components/garden_irrigation/strings.json >/dev/null
          find tests/fixtures -name '*.json' -print0 | xargs -0 -r -n1 python3 -m json.tool >/dev/null
          python3 -m compileall -q custom_components/garden_irrigation tests
          python3 -m unittest discover -s tests

      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1 || \
            gh release create "$GITHUB_REF_NAME" \
              --title "$GITHUB_REF_NAME" \
              --notes "Garden Irrigation Home Assistant integration $GITHUB_REF_NAME."

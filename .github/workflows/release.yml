name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  github-release:
    name: Publish GitHub release
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Validate manifest version matches tag
        run: |
          tag="${GITHUB_REF_NAME#v}"
          scripts/ha-integration-release-check.sh --expect-version "$tag"

      - name: Run release checks
        run: scripts/ha-integration-release-check.sh

      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1 || \
            gh release create "$GITHUB_REF_NAME" \
              --title "$GITHUB_REF_NAME" \
              --notes "Garden Irrigation Home Assistant integration $GITHUB_REF_NAME."
